name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run lint

  # The iPhone app: the Swift core's tests, then the app and its widgets built for the simulator.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift core tests
        working-directory: ios/WilListCore
        run: swift test
      - name: Build the app for the simulator
        run: >
          xcodebuild -project ios/WilList.xcodeproj -scheme WilList -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ci
          -quiet build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
