name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run lint

  # The iPhone app: the Swift core's tests, then the app and its widgets built for the simulator.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift core tests
        working-directory: ios/WilListCore
        run: swift test
      - name: Build the app and run the UI tests
        run: |
          # Runner images differ, and now and then a fresh one lists no simulator at all: use an
          # iPhone 17 if there is one, any iPhone if not, and make one when there is none.
          iphone() {
            xcrun simctl list devices available -j | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[]
              | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))]
              | (map(select(.name == "iPhone 17")) + .) | first | .udid // empty'
          }
          runtime() {
            xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.identifier | contains("iOS"))] | last | .identifier // empty'
          }
          id=$(iphone)
          if [ -z "$id" ]; then
            [ -n "$(runtime)" ] || xcodebuild -downloadPlatform iOS
            id=$(xcrun simctl create "iPhone 17" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$(runtime)")
          fi
          xcodebuild test -project ios/WilList.xcodeproj -scheme WilList \
            -destination "id=$id" -derivedDataPath build/ci \
            -resultBundlePath build/ci/tests.xcresult -quiet
      - name: Say why a UI test failed
        if: failure()
        run: >
          [ ! -d build/ci/tests.xcresult ] ||
          xcrun xcresulttool get test-results summary --path build/ci/tests.xcresult

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
