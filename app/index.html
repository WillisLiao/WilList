<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WilList</title>
  <meta name="description" content="A student planner built on Brian Tracy's ABCDE method: write it all down, fill in a letter, do your A1 first.">
  <meta name="theme-color" content="#fdfdfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WilList">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="sheet-top">
    <div class="top-inner">
      <div class="formhead">
        <span class="display wordmark">WIL<b>LIST</b></span>
        <span class="mono" id="formdate">Form A–E</span>
      </div>
      <form id="qa" class="qa" autocomplete="off">
        <div class="qa-field">
          <label for="qa-input" class="form box-label">Write it down</label>
          <input id="qa-input" type="text" enterkeyhint="done" spellcheck="false" placeholder="Chem quiz thu 2pm">
        </div>
        <button type="button" id="qa-more" class="btn" aria-label="Add with details" title="Add with details">More</button>
        <button type="submit" class="btn primary" aria-label="Add">Add</button>
      </form>
      <div id="qa-preview" class="qa-preview" aria-live="polite"></div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" class="nav" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">WilList needs JavaScript turned on.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
