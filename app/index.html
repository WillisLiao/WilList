<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WilList</title>
  <meta name="description" content="A student planner built on Brian Tracy's ABCDE method: write it all down, give each a letter, do your A1 first.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WilList">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="side">
      <div class="brandbar">
        <a class="brand" href="#today" aria-label="WilList, today"><span class="mark" aria-hidden="true"></span><b>WilList</b></a>
        <span id="where" class="where" aria-hidden="true"></span>
        <button id="fab" class="btn primary add" type="button" aria-label="Write something down" title="Write something down ( / )"><span>Write it down</span><kbd>/</kbd></button>
      </div>
      <nav id="nav" class="nav" aria-label="Main"></nav>
    </aside>
    <main id="main" class="canvas" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">WilList needs JavaScript turned on.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
