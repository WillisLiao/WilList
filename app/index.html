<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WilList</title>
  <meta name="description" content="A student planner built on Brian Tracy's ABCDE method: capture everything, give it a letter, do your A1 first.">
  <meta name="theme-color" content="#f6f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f1a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WilList">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>WilList</span></div>
      <form id="qa" class="qa" autocomplete="off">
        <label for="qa-input" class="visually-hidden">Add anything</label>
        <input id="qa-input" type="text" enterkeyhint="done" spellcheck="false"
          placeholder="Add anything… “Chem quiz thu 2pm”">
        <button type="button" id="qa-more" class="icon-btn" aria-label="Add with details" title="Add with details">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>
        </button>
        <button type="submit" class="qa-add" aria-label="Add">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
      <div id="qa-preview" class="qa-preview" aria-live="polite"></div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" class="nav" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">WilList needs JavaScript turned on.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
