<!doctype html>
<html lang="en" class="app">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WilList</title>
  <meta name="description" content="A student planner built on Brian Tracy's ABCDE method: write it all down, fill in a letter, do your A1 first.">
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WilList">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" class="nav" aria-label="Main"></nav>
  <button id="fab" class="fab" type="button" aria-label="Write something down" title="Write something down ( / )"><span>Write it down</span><kbd>/</kbd></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">WilList needs JavaScript turned on.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
